services:
  - type: web
    name: amigo-secreto-2026
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: amigo-secreto-db
          property: connectionString

databases:
  - name: amigo-secreto-db
    plan: free
    region: virginia
    databaseName: amigo_secreto_db_pvcg
    user: amigo_secreto_db_pvcg_user
